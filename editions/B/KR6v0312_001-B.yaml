body:
  text: 民國法舫法師譯如是我聞一時佛在舍衛國祇樹給孤獨園爾時有一天人於後夜分身諸光明徧照祇樹園林來詣佛所到已頂禮世尊却住一面而以偈白佛言諸天與世人思維吉祥事希求於幸福何謂勝吉祥一遠離愚癡人親近智慧者供養於應供此事勝吉祥二靜住安適處由曾作福業而自修善德此事勝吉祥三凡學諸律儀真實與工巧及善說語言此事勝吉祥四侍奉於父母攝受妻與子所作無繫累此事勝吉祥五布施與修持攝受親眷屬諸業無過咎此事勝吉祥六遠離諸惡業亦不飲諸酒於法不放逸此事勝吉祥七尊敬與謙讓知足常感恩依時聽正法此事勝吉祥八忍辱與謙卑具足正知見談論於正法此事勝吉祥九苦行與梵行而得見聖諦證悟於涅槃此事勝吉祥十接觸世間法心寂不為動無憂離貪欲此事勝吉祥十一如是修諸行而能無墮失隨處得安隱此諸事吉祥十二終
